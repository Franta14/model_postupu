<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Scrollienteering</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/4/44/Orienteering_flag.svg">

    <!-- Custom PWA Styles -->
    <link rel="stylesheet" href="style.css?v=30"/>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
        window.onerror = function(message, source, lineno, colno, error) {
            alert("JS Error: " + message + " at " + lineno + ":" + colno);
            return true;
        };
        window.addEventListener('unhandledrejection', function(event) {
            alert("Promise Error: " + event.reason);
        });
    </script>
</head>
<body>
    <div id="loader">Načítám postupy...</div>
    
    <div id="calibration-ui">
        KALIBRAČNÍ MÓD ZAPNUT<br>
        Šipkami posouvej trasu.<br>
        X: <span id="calib-x">400</span> | Y: <span id="calib-y">-300</span>
    </div>
    
    <!-- Foreground scroll-snapping reels -->
    <div id="reels-container">
        <!-- JS will inject .reel elements here -->
    </div>
    
    <!-- Global Variants Panel (Bottom Sheet) -->
    <div class="variants-panel pos-top-right" id="global-variants-panel">
        <div class="panel-header">
            <div class="panel-title">Ideální postupy</div>
            <button class="toggle-btn" id="global-toggle-btn"><svg class="toggle-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
        </div>
        <div id="global-variants-content"></div>
    </div>
    
    <!-- Offline Sync Button -->
    <button id="offline-sync-btn" class="sync-btn" onclick="startOfflineSync()" title="Uložit mapu do paměti (Offline)">
        <svg class="sync-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v12m0 0l-4-4m4 4l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>
    
    <!-- Sync Progress Overlay -->
    <div id="sync-progress" class="sync-progress-overlay">
        <div class="sync-box">
            <h4>Stahování dat...</h4>
            <div class="progress-bar"><div id="sync-bar" class="progress-fill"></div></div>
            <div id="sync-text">0 / 0</div>
        </div>
    </div>
    
    <script src="app.js?v=21"></script>
</body>
</html>
