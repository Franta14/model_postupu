<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postupy - Livelox Vizualizace</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Orienteering<br><span>Livelox Simulátor</span></h2>
            </div>
            
            <div class="control-group">
                <label for="mapSelect">Výběr mapy</label>
                <select id="mapSelect">
                    <option value="">Načítám mapy...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="routeSelect">Výběr postupu</label>
                <select id="routeSelect">
                    <option value="">Vyberte mapu</option>
                </select>
            </div>

            <div class="stats-container" id="statsContainer">
                <!-- Variant stats injected by JS -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="mapCanvas"></canvas>
            </div>
            
            <!-- Timeline Controls -->
            <div class="timeline-panel">
                <button id="btnPlayPause" class="btn-play">▶ Play</button>
                <div class="slider-wrapper">
                    <input type="range" id="timeSlider" min="0" max="100" value="0" step="0.1">
                    <div class="time-display" id="timeDisplay">00:00</div>
                </div>
                <div class="speed-control">
                    <label>Rychlost</label>
                    <select id="speedSelect">
                        <option value="1">1x</option>
                        <option value="5">5x</option>
                        <option value="10" selected>10x</option>
                        <option value="20">20x</option>
                        <option value="50">50x</option>
                    </select>
                </div>
                <div class="speed-control">
                    <label>Ocásek (s)</label>
                    <input type="number" id="tailInput" value="20" min="0" max="300" step="5" style="width: 60px; background-color: #2A2A2A; border: 1px solid #444; color: white; padding: 6px; border-radius: 4px; text-align:center;">
                </div>
            </div>
        </main>
    </div>
    
    <script src="app.js?t=1789840868"></script>
</body>
</html>
